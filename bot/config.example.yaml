# QQ 机器人配置模板
#
# 用法：复制成 bot/config.yaml 再填入真实凭据。
#
#     cp bot/config.example.yaml bot/config.yaml
#
# ⚠️ bot/config.yaml 已在 .gitignore 里，**不要**把它提交到仓库。
#    凭据也可以改用环境变量提供（优先级高于本文件）：
#
#     QQBOT_APPID / QQBOT_SECRET / QQBOT_API_BASE

# QQ 开放平台机器人凭据（https://bot.q.qq.com/）
appid: "你的APPID"
secret: "你的SECRET"

# helldiversbot API 的地址。默认是本机 8808 端口，即 `python run.py` 起的服务。
# 如果 API 跑在别处，改这里。
api_base: "http://127.0.0.1:8808"

# 单条回复的字符上限。QQ 对消息长度有限制，超长会被截断。
max_reply_chars: 900

# HTTP 请求超时（秒）
http_timeout: 20
